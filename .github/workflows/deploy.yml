name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE="asia-east1-docker.pkg.dev/qyproperty/qyproperty/web"
          TAG_SHA="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${TAG_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: qyproperty
          region: asia-east1
          image: asia-east1-docker.pkg.dev/qyproperty/qyproperty/web:latest
          flags: --port=3000 --allow-unauthenticated
